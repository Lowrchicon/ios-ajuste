<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador 360°</title>
    <style>
        body, ::backdrop {
            background: #fff;
        }
        
        /* Ajuste essencial para o iOS não cortar a tela */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #fullscreen-button {
            position: absolute;
            top:  15px;
            right:  15px;
            background: rgb(10, 182, 212);
            border:  0;
            width:  40px;
            height:  40px;
            border-radius: 50%;
            box-sizing: border-box;
            transition:  transform .3s;
            cursor:  pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* Centraliza os SVGs internamente */
            z-index: 99999; /* Garante que o botão fique visível por cima de tudo no iOS */
        }
        #fullscreen-button:hover {
            transform: scale(1.125);
        }
        
        /* Controle dos ícones (Garante suporte nativo e fallback iOS) */
        #fullscreen-button svg:nth-child(2) { 
            display: none;
        }
        :fullscreen #fullscreen-button svg:nth-child(1),
        [fullscreen] #fullscreen-button svg:nth-child(1) {
            display: none;
        }
        :fullscreen #fullscreen-button svg:nth-child(2),
        [fullscreen] #fullscreen-button svg:nth-child(2) {
            display: inline-block;
        }

        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 8px solid #b1f0f0;
            border-top: 8px solid #0b5757;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #modal-wrapper {
            display: none;
        }

        /* --- SOLUÇÃO DE TELA CHEIA PARA IPHONE (iOS) --- */
        body[fullscreen] {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            z-index: 99998;
        }
    </style>
</head>
<body>

<div id="loading-spinner"></div>

<!-- Adicionado o botão de tela cheia no HTML principal com os dois SVGs de exemplo -->
<button id="fullscreen-button">
    <!-- SVG 1: Ícone de Ampliar (Entrar em Tela Cheia) -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <!-- SVG 2: Ícone de Reduzir (Sair da Tela Cheia) -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/></svg>
</button>

<div id="modal-wrapper" class="modal">
    <div class="center">
        <div class="rotation">
            <img src="images/360/100.jpg">
            <img src="images/360/101.jpg">
            <img src="images/360/102.jpg">

            <img src="images/360/112.jpg">
            <img src="images/360/113.jpg">
            <img src="images/360/114.jpg">
            <img src="images/360/115.jpg">
            <img src="images/360/116.jpg">
            <img src="images/360/117.jpg">
            <img src="images/360/118.jpg">
            <img src="images/360/119.jpg">
            <img src="images/360/120.jpg">
            <img src="images/360/121.jpg">
            <img src="images/360/122.jpg">
            <img src="images/360/123.jpg">
            <img src="images/360/124.jpg">
            <img src="images/360/125.jpg">
            <img src="images/360/126.jpg">
            <img src="images/360/127.jpg">
            <img src="images/360/128.jpg">

            <img src="images/360/144.jpg">  
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const images = document.querySelectorAll(".rotation img");
        let loadedImages = 0;
        const totalImages = images.length;
        const loadingSpinner = document.getElementById("loading-spinner");
        const modalWrapper = document.getElementById("modal-wrapper");

        images.forEach(img => {
            img.onload = checkAllImagesLoaded;
            img.onerror = checkAllImagesLoaded;
        });

        // Timeout para garantir que o loading desapareça mesmo com falhas no carregamento
        const maxLoadTime = 10000; // 10 segundos
        setTimeout(() => {
            if(loadingSpinner.style.display !== "none") {
                loadingSpinner.style.display = "none";
                modalWrapper.style.display = "block";
            }
        }, maxLoadTime);

        function checkAllImagesLoaded() {
            loadedImages++;
            if (loadedImages === totalImages) {
                loadingSpinner.style.display = "none";
                modalWrapper.style.display = "block";
            }
        }

        // --- LÓGICA DO BOTÃO TELA CHEIA (ANDROID E IOS) ---
        const fullscreenButton = document.getElementById('fullscreen-button');

        fullscreenButton.addEventListener('click', function() {
            // Checa suporte nativo à API Fullscreen (Disponível em Android e PCs)
            const nativeSupport = document.fullscreenEnabled || document.webkitFullscreenEnabled;

            if (nativeSupport) {
                // Modo Nativo
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            } else {
                // Modo Fallback (iPhone / iOS)
                if (document.body.hasAttribute('fullscreen')) {
                    document.body.removeAttribute('fullscreen');
                } else {
                    document.body.setAttribute('fullscreen', '');
                }
            }
        });

        // Eventos para escutar mudanças nativas do sistema (caso o usuário aperte "Voltar")
        function handleFullscreenChange() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                document.body.setAttribute('fullscreen', '');
            } else {
                document.body.removeAttribute('fullscreen');
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    });
</script>

<script src="js/360deg.js"></script>
</body>
</html>
