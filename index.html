
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Visualizador 360°</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 8px solid #b1f0f0;
            border-top: 8px solid #0b5757;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            z-index: 100000;
        }

        @keyframes spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        #modal-wrapper {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #fff;
            overflow: hidden;
            touch-action: pan-y;
        }

        #modal-wrapper.is-ready {
            display: block;
        }

        .center {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rotation {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;
        }

        .rotation:active {
            cursor: grabbing;
        }

        .rotation img {
            position: absolute;
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
        }

        .rotation img.active {
            opacity: 1;
        }

        #fullscreen-button {
            position: fixed;
            top: calc(15px + env(safe-area-inset-top));
            right: calc(15px + env(safe-area-inset-right));
            z-index: 100001;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;
            padding: 0;

            border: none;
            border-radius: 50%;
            background: rgb(10, 182, 212);
            color: #fff;

            font-size: 27px;
            line-height: 1;
            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        #fullscreen-button:active {
            transform: scale(0.94);
        }

        /* Modo de tela cheia simulado para iOS */
        #modal-wrapper.ios-fullscreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            z-index: 99999;
            background: #fff;
        }

        body.ios-fullscreen-active {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #modal-wrapper.ios-fullscreen .center {
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        @media (hover: hover) {
            #fullscreen-button:hover {
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>

    <div id="loading-spinner" aria-label="Carregando imagens"></div>

        <button
            id="fullscreen-button"
            type="button"
            aria-label="Ativar tela cheia"
            aria-pressed="false">
            ⛶
        </button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const images = Array.from(
                document.querySelectorAll("#rotation img")
            );

            const spinner = document.getElementById("loading-spinner");
            const wrapper = document.getElementById("modal-wrapper");

            let finished = 0;
            let revealed = false;

            function finishLoading() {
                finished++;

                if (finished >= images.length) {
                    showViewer();
                }
            }

            function showViewer() {
                if (revealed) return;
                revealed = true;

                if (images.length > 0) {
                    images[0].classList.add("active");
                }

                wrapper.classList.add("is-ready");
                spinner.style.display = "none";
            }

            images.forEach(function (img) {
                if (img.complete) {
                    finishLoading();
                } else {
                    img.addEventListener("load", finishLoading, {
                        once: true
                    });

                    img.addEventListener("error", finishLoading, {
                        once: true
                    });
                }
            });

            // Evita deixar o carregamento preso indefinidamente.
            setTimeout(showViewer, 10000);
        });
    </script>

    <script src="js/360deg.js"></script>
